// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.2.0'
    ext.kotlin_coroutines_version = '1.6.2'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // http://tools.android.com/tech-docs/new-build-system/gradle-experimental
        // https://bintray.com/android/android-tools/com.android.tools.build.gradle-experimental/view
        // https://bintray.com/android/android-tools/com.google.gms.google-services/view
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        maven {
            url "http://office.fulldive.com:8083"
            allowInsecureProtocol = true
        }
        jcenter()
        mavenCentral()
        maven {
            url 'https://maven.google.com'
        }
    }
}

subprojects {
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.support'
                    && !details.requested.name.contains('multidex')) {
                details.useVersion "27.1.1"
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
